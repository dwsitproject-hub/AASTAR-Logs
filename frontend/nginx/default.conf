# Local Docker variant of the frontend-server config in TECHNICAL-DESIGN.md §4.3
# (plain HTTP on localhost; production terminates TLS and adds HSTS/CSP).
# Docker's DNS: re-resolve the backend so recreating its container does not leave a stale IP.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream erp_backend {
  zone erp_backend 64k;
  server backend:3001 resolve;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  location = /api/ws {
    proxy_pass http://erp_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://erp_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    client_max_body_size 200k;
  }

  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
