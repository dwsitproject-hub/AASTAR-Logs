<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="782" viewBox="0 0 1200 782"><rect width="100%" height="100%" fill="#ffffff"/><text x="600" y="34" font-family="Arial" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">SP-01 — DWS Hub sign-in (authorization code + PKCE S256)</text><rect x="25" y="70" width="170" height="44" rx="6" fill="#eef1f4" stroke="#5b6b7c" stroke-width="1.4"/><text x="110" y="97" font-family="Arial" font-size="13" font-weight="700" fill="#5b6b7c" text-anchor="middle">Browser</text><line x1="110" y1="114" x2="110" y2="762" stroke="#c3ccd6" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="270" y="70" width="170" height="44" rx="6" fill="#e3f2f0" stroke="#1f6f6b" stroke-width="1.4"/><text x="355" y="88.5" font-family="Arial" font-size="13" font-weight="700" fill="#1f6f6b" text-anchor="middle">Frontend</text><text x="355" y="105.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">Nginx</text><line x1="355" y1="114" x2="355" y2="762" stroke="#c3ccd6" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="515" y="70" width="170" height="44" rx="6" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.4"/><text x="600" y="88.5" font-family="Arial" font-size="13" font-weight="700" fill="#1f3a5f" text-anchor="middle">Backend</text><text x="600" y="105.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">Express :3001</text><line x1="600" y1="114" x2="600" y2="762" stroke="#c3ccd6" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="760" y="70" width="170" height="44" rx="6" fill="#fbf0e1" stroke="#9a5a12" stroke-width="1.4"/><text x="845" y="88.5" font-family="Arial" font-size="13" font-weight="700" fill="#9a5a12" text-anchor="middle">DWS Hub</text><text x="845" y="105.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">OIDC provider</text><line x1="845" y1="114" x2="845" y2="762" stroke="#c3ccd6" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="1005" y="70" width="170" height="44" rx="6" fill="#f1eaf6" stroke="#5b3b77" stroke-width="1.4"/><text x="1090" y="88.5" font-family="Arial" font-size="13" font-weight="700" fill="#5b3b77" text-anchor="middle">PostgreSQL</text><text x="1090" y="105.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">app / audit</text><line x1="1090" y1="114" x2="1090" y2="762" stroke="#c3ccd6" stroke-width="1.2" stroke-dasharray="4 4"/><defs><marker id="m20" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><line x1="110" y1="140" x2="352" y2="140" stroke="#1d2733" stroke-width="1.6" marker-end="url(#m20)"/><text x="232.5" y="134" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">GET /api/auth/sso/login?next=/logistics/…</text><defs><marker id="m23" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><line x1="355" y1="176" x2="597" y2="176" stroke="#1d2733" stroke-width="1.6" marker-end="url(#m23)"/><text x="477.5" y="170" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">proxy</text><defs><marker id="m26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><line x1="600" y1="212" x2="842" y2="212" stroke="#1d2733" stroke-width="1.6" marker-end="url(#m26)"/><text x="722.5" y="206" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">GET /.well-known/openid-configuration (cached 1 h)</text><defs><marker id="p29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><polyline points="600,240 640,240 640,254 604,254" fill="none" stroke="#1d2733" stroke-width="1.6" marker-end="url(#p29)"/><text x="648" y="250" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start">state, nonce, PKCE verifier → sealed __Host-erp_sso cookie (10 min)</text><defs><marker id="m32" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><line x1="600" y1="284" x2="113" y2="284" stroke="#1d2733" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m32)"/><text x="355" y="278" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">302 → Hub /authorize?code_challenge=S256(verifier)&amp;state&amp;nonce</text><defs><marker id="m35" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><line x1="110" y1="320" x2="842" y2="320" stroke="#1d2733" stroke-width="1.6" marker-end="url(#m35)"/><text x="477.5" y="314" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">authorize (user signs in at the Hub)</text><defs><marker id="m38" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><line x1="845" y1="356" x2="113" y2="356" stroke="#1d2733" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m38)"/><text x="477.5" y="350" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">302 → /api/auth/sso/callback?code&amp;state</text><defs><marker id="m41" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><line x1="110" y1="392" x2="597" y2="392" stroke="#1d2733" stroke-width="1.6" marker-end="url(#m41)"/><text x="355" y="386" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">GET callback (via Nginx) + transaction cookie</text><rect x="386.4" y="414" width="427.20000000000005" height="22" rx="3" fill="#fffbe6" stroke="#d9c46a" stroke-width="1.4"/><text x="600" y="430" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">state must equal the sealed cookie; cookie cleared (single use)</text><defs><marker id="m46" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><line x1="600" y1="464" x2="842" y2="464" stroke="#1d2733" stroke-width="1.6" marker-end="url(#m46)"/><text x="722.5" y="458" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">POST /api/sso/token {code, code_verifier, client_id, redirect_uri}</text><defs><marker id="m49" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><line x1="845" y1="500" x2="603" y2="500" stroke="#1d2733" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m49)"/><text x="722.5" y="494" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">{ id_token } (expires_in 60 s)</text><defs><marker id="m52" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><line x1="600" y1="536" x2="842" y2="536" stroke="#1d2733" stroke-width="1.6" marker-end="url(#m52)"/><text x="722.5" y="530" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">GET /api/sso/jwks (jose cache; refetch on unknown kid)</text><rect x="354.4" y="558" width="491.20000000000005" height="22" rx="3" fill="#fffbe6" stroke="#d9c46a" stroke-width="1.4"/><text x="600" y="574" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">verify signature · iss · aud · exp · sub · nonce; email domain allow-list</text><defs><marker id="m57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><line x1="600" y1="608" x2="1087" y2="608" stroke="#1d2733" stroke-width="1.6" marker-end="url(#m57)"/><text x="845" y="602" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">find users by hub_sub → else link by email → else insert pending</text><defs><marker id="m60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><line x1="600" y1="644" x2="1087" y2="644" stroke="#1d2733" stroke-width="1.6" marker-end="url(#m60)"/><text x="845" y="638" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">INSERT audit.authentication_events (dws-hub, result)</text><defs><marker id="m63" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><line x1="600" y1="680" x2="113" y2="680" stroke="#1d2733" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#m63)"/><text x="355" y="674" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">approved: Set-Cookie __Host-erp_session (8 h) + 302 next  |  pending: 302 /login?sso_error=pending</text><defs><marker id="m66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><line x1="110" y1="716" x2="597" y2="716" stroke="#1d2733" stroke-width="1.6" marker-end="url(#m66)"/><text x="355" y="710" font-family="Arial" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle">GET /api/auth/me → user + csrfToken; DwsHub.identify({ id: sub, email })</text></svg>