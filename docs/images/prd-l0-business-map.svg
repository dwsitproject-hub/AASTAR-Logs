<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><rect width="100%" height="100%" fill="#ffffff"/><text x="550" y="34" font-family="Arial" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">Astar ERP — L0 business process map</text><rect x="330" y="56" width="440" height="62" rx="6" fill="#f1eaf6" stroke="#5b3b77" stroke-width="1.4"/><text x="550" y="83.5" font-family="Arial" font-size="14" font-weight="700" fill="#5b3b77" text-anchor="middle">L0-01  Identity &amp; Access Management</text><text x="550" y="100.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">DWS Hub sign-in · approval · page access</text><rect x="40" y="250" width="230" height="90" rx="6" fill="#fbf0e1" stroke="#9a5a12" stroke-width="1.4"/><text x="155" y="283" font-family="Arial" font-size="14" font-weight="700" fill="#9a5a12" text-anchor="middle">L0-07  Master Data Sync</text><text x="155" y="300" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">Google Sheets → ERP mirror</text><text x="155" y="317" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">every 15 s; edits written back</text><rect x="370" y="160" width="300" height="66" rx="6" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.4"/><text x="520" y="189.5" font-family="Arial" font-size="14" font-weight="700" fill="#1f3a5f" text-anchor="middle">L0-03  Vessel Scheduling</text><text x="520" y="206.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">laycan · CR · ETA/ETB/ETC · tracking</text><rect x="370" y="246" width="300" height="66" rx="6" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.4"/><text x="520" y="275.5" font-family="Arial" font-size="14" font-weight="700" fill="#1f3a5f" text-anchor="middle">L0-02  Contract-to-Vessel Allocation</text><text x="520" y="292.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">matching · partials · unlink</text><rect x="370" y="332" width="300" height="66" rx="6" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.4"/><text x="520" y="361.5" font-family="Arial" font-size="14" font-weight="700" fill="#1f3a5f" text-anchor="middle">L0-05  Stock Monitoring</text><text x="520" y="378.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">daily stock vs incoming vessels</text><rect x="370" y="418" width="300" height="66" rx="6" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.4"/><text x="520" y="447.5" font-family="Arial" font-size="14" font-weight="700" fill="#1f3a5f" text-anchor="middle">L0-06  Laytime &amp; Demurrage</text><text x="520" y="464.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">calculator · estimated demurrage</text><rect x="790" y="246" width="270" height="90" rx="6" fill="#e3f2f0" stroke="#1f6f6b" stroke-width="1.4"/><text x="925" y="279" font-family="Arial" font-size="14" font-weight="700" fill="#1f6f6b" text-anchor="middle">L0-04  Export Execution</text><text x="925" y="296" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">&amp; Reporting</text><text x="925" y="313" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">summaries · weekly ops · KPN export</text><rect x="40" y="520" width="1020" height="54" rx="6" fill="#eef1f4" stroke="#5b6b7c" stroke-width="1.4" stroke-dasharray="6 4"/><text x="550" y="543.5" font-family="Arial" font-size="14" font-weight="700" fill="#1d2733" text-anchor="middle">L0-08  Platform Operations, Support &amp; Audit</text><text x="550" y="560.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">activity audit · readiness · DWS Hub analytics, bug reports and Sentinel</text><defs><marker id="m27" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start