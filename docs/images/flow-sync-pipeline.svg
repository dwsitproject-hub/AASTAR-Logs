<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect width="100%" height="100%" fill="#ffffff"/><text x="600" y="34" font-family="Arial" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">SP-03 — Google Sheets ingestion pipeline (every 15 s, one run at a time)</text><rect x="40" y="80" width="200" height="96" rx="6" fill="#fbf0e1" stroke="#9a5a12" stroke-width="1.4"/><text x="140" y="116" font-family="Arial" font-size="13" font-weight="700" fill="#9a5a12" text-anchor="middle">1 Timer tick</text><text x="140" y="133" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">skip if a run</text><text x="140" y="150" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">is in progress</text><rect x="270" y="80" width="200" height="96" rx="6" fill="#fbf0e1" stroke="#9a5a12" stroke-width="1.4"/><text x="370" y="116" font-family="Arial" font-size="13" font-weight="700" fill="#9a5a12" text-anchor="middle">2 Group sources</text><text x="370" y="133" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">by spreadsheet +</text><text x="370" y="150" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">service account</text><rect x="500" y="80" width="200" height="96" rx="6" fill="#fbf0e1" stroke="#9a5a12" stroke-width="1.4"/><text x="600" y="116" font-family="Arial" font-size="13" font-weight="700" fill="#9a5a12" text-anchor="middle">3 batchGet</text><text x="600" y="133" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">UNFORMATTED values</text><text x="600" y="150" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">serial dates, 60 s timeout</text><rect x="730" y="80" width="200" height="96" rx="6" fill="#fbf0e1" stroke="#9a5a12" stroke-width="1.4"/><text x="830" y="107.5" font-family="Arial" font-size="13" font-weight="700" fill="#9a5a12" text-anchor="middle">4 Normalise</text><text x="830" y="124.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">fill-down merged rows</text><text x="830" y="141.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">Match-ID repair</text><text x="830" y="158.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">identifier cleanup</text><rect x="960" y="80" width="200" height="96" rx="6" fill="#fbf0e1" stroke="#9a5a12" stroke-width="1.4"/><text x="1060" y="107.5" font-family="Arial" font-size="13" font-weight="700" fill="#9a5a12" text-anchor="middle">5 Hash compare</text><text x="1060" y="124.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">unchanged → stop</text><text x="1060" y="141.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">failed range → keep</text><text x="1060" y="158.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">old data</text><rect x="40" y="270" width="200" height="96" rx="6" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.4"/><text x="140" y="306" font-family="Arial" font-size="13" font-weight="700" fill="#1f3a5f" text-anchor="middle">6 Load staging</text><text x="140" y="323" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">COPY into</text><text x="140" y="340" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">mirror.&lt;t&gt;__staging</text><rect x="270" y="270" width="200" height="96" rx="6" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.4"/><text x="370" y="297.5" font-family="Arial" font-size="13" font-weight="700" fill="#1f3a5f" text-anchor="middle">7 Swap</text><text x="370" y="314.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">one short txn: DROP</text><text x="370" y="331.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">old, RENAME staging,</text><text x="370" y="348.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">meta.version + 1</text><rect x="500" y="270" width="200" height="96" rx="6" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.4"/><text x="600" y="306" font-family="Arial" font-size="13" font-weight="700" fill="#1f3a5f" text-anchor="middle">8 Link graph</text><text x="600" y="323" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">rebuild links.* if</text><text x="600" y="340" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">DB1-6 / DB10 changed</text><rect x="730" y="270" width="200" height="96" rx="6" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.4"/><text x="830" y="306" font-family="Arial" font-size="13" font-weight="700" fill="#1f3a5f" text-anchor="middle">9 Invalidate</text><text x="830" y="323" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">dashboard caches</text><text x="830" y="340" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">keyed by version</text><rect x="960" y="270" width="200" height="96" rx="6" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.4"/><text x="1060" y="306" font-family="Arial" font-size="13" font-weight="700" fill="#1f3a5f" text-anchor="middle">10 Broadcast</text><text x="1060" y="323" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">data.updated to</text><text x="1060" y="340" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">permitted sockets</text><defs><marker id="m44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><line x1="240" y1="128" x2="268" y2="128" stroke="#7a8a9a" stroke-width="1.6" marker-end="url(#m44)"/><defs><marker id="m46" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><line x1="240" y1="318" x2="268" y2="318" stroke="#7a8a9a" stroke-width="1.6" marker-end="url(#m46)"/><defs><marker id="m48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><line x1="470" y1="128" x2="498" y2="128" stroke="#7a8a9a" stroke-width="1.6" marker-end="url(#m48)"/><defs><marker id="m50" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><line x1="470" y1="318" x2="498" y2="318" stroke="#7a8a9a" stroke-width="1.6" marker-end="url(#m50)"/><defs><marker id="m52" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><line x1="700" y1="128" x2="728" y2="128" stroke="#7a8a9a" stroke-width="1.6" marker-end="url(#m52)"/><defs><marker id="m54" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><line x1="700" y1="318" x2="728" y2="318" stroke="#7a8a9a" stroke-width="1.6" marker-end="url(#m54)"/><defs><marker id="m56" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><line x1="930" y1="128" x2="958" y2="128" stroke="#7a8a9a" stroke-width="1.6" marker-end="url(#m56)"/><defs><marker id="m58" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><line x1="930" y1="318" x2="958" y2="318" stroke="#7a8a9a" stroke-width="1.6" marker-end="url(#m58)"/><defs><marker id="p60" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><polyline points="1060,176 1060,230 140,230 140,268" fill="none" stroke="#7a8a9a" stroke-width="1.6" marker-end="url(#p60)"/><text x="600" y="224" font-family="Arial" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">changed databases only</text><text x="600" y="400" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle" font-style="italic">Target (PostgreSQL): readers keep reading the old table until step 7 commits — no torn reads. Today (SQLite): temp file + atomic rename.</text></svg>