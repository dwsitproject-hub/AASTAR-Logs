<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="100%" height="100%" fill="#ffffff"/><text x="600" y="34" font-family="Arial" font-size="18" font-weight="700" fill="#1f3a5f" text-anchor="middle">Target deployment — frontend server, backend server, ApsaraDB RDS for PostgreSQL 18</text><rect x="40" y="185" width="170" height="90" rx="6" fill="#eef1f4" stroke="#5b6b7c" stroke-width="1.4"/><text x="125" y="218" font-family="Arial" font-size="14" font-weight="700" fill="#1d2733" text-anchor="middle">Users</text><text x="125" y="235" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">browser (HTTPS)</text><text x="125" y="252" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">≥ 10 concurrent</text><rect x="260" y="70" width="640" height="600" rx="10" fill="#f7f9fc" stroke="#1f3a5f" stroke-width="1.4" stroke-dasharray="8 5"/><text x="280" y="96" font-family="Arial" font-size="13" font-weight="700" fill="#1f3a5f" text-anchor="start">Alibaba Cloud VPC (private subnet; only the frontend has a public endpoint)</text><rect x="300" y="130" width="260" height="200" rx="6" fill="#e3f2f0" stroke="#1f6f6b" stroke-width="1.4"/><text x="430" y="184" font-family="Arial" font-size="14" font-weight="700" fill="#1f6f6b" text-anchor="middle">Server 1 — Frontend</text><text x="430" y="201" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">ECS · Nginx 1.2x</text><text x="430" y="218" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">TLS 443 (public / SLB)</text><text x="430" y="235" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">serves frontend/dist (SPA)</text><text x="430" y="252" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">CSP · HSTS · gzip</text><text x="430" y="269" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">proxy /api/* and /api/ws →</text><text x="430" y="286" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">backend :3001 (private)</text><rect x="300" y="400" width="260" height="230" rx="6" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.4"/><text x="430" y="460.5" font-family="Arial" font-size="14" font-weight="700" fill="#1f3a5f" text-anchor="middle">Server 2 — Backend</text><text x="430" y="477.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">ECS · Node.js 22 LTS · PM2</text><text x="430" y="494.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">Express API + WebSocket :3001</text><text x="430" y="511.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">Sheets sync job (15 s)</text><text x="430" y="528.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">single instance (in-memory</text><text x="430" y="545.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">caches, write queue, rate limits)</text><text x="430" y="562.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">Google service-account keys</text><text x="430" y="579.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">outbound HTTPS only</text><rect x="640" y="400" width="230" height="230" rx="6" fill="#f1eaf6" stroke="#5b3b77" stroke-width="1.4"/><text x="755" y="460.5" font-family="Arial" font-size="14" font-weight="700" fill="#5b3b77" text-anchor="middle">Server 3 — Database</text><text x="755" y="477.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">ApsaraDB RDS</text><text x="755" y="494.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">PostgreSQL 18</text><text x="755" y="511.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">schemas: app · security</text><text x="755" y="528.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">audit · mirror · links</text><text x="755" y="545.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">SSL · whitelist = backend IP</text><text x="755" y="562.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">auto backup + PITR</text><text x="755" y="579.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">port 5432 (private)</text><rect x="640" y="130" width="230" height="200" rx="6" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.4"/><text x="755" y="184" font-family="Arial" font-size="13" font-weight="700" fill="#1d2733" text-anchor="middle">Security groups</text><text x="755" y="201" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">SG-FE: in 443 from internet;</text><text x="755" y="218" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">out 3001 to SG-BE</text><text x="755" y="235" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">SG-BE: in 3001 from SG-FE only;</text><text x="755" y="252" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">out 443 internet, 5432 RDS</text><text x="755" y="269" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">RDS whitelist: BE private IP</text><text x="755" y="286" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">SSH via bastion only</text><rect x="960" y="110" width="210" height="110" rx="6" fill="#fbf0e1" stroke="#9a5a12" stroke-width="1.4"/><text x="1065" y="144.5" font-family="Arial" font-size="14" font-weight="700" fill="#9a5a12" text-anchor="middle">DWS Hub</text><text x="1065" y="161.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">OIDC sign-in (authorize,</text><text x="1065" y="178.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">token, JWKS) · SDK script</text><text x="1065" y="195.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">analytics · Sentinel</text><rect x="960" y="260" width="210" height="90" rx="6" fill="#fbf0e1" stroke="#9a5a12" stroke-width="1.4"/><text x="1065" y="293" font-family="Arial" font-size="14" font-weight="700" fill="#9a5a12" text-anchor="middle">Google Sheets API</text><text x="1065" y="310" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">17 ranges read every 15 s</text><text x="1065" y="327" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">interactive writes</text><rect x="960" y="390" width="210" height="70" rx="6" fill="#fbf0e1" stroke="#9a5a12" stroke-width="1.4"/><text x="1065" y="421.5" font-family="Arial" font-size="14" font-weight="700" fill="#9a5a12" text-anchor="middle">SMTP</text><text x="1065" y="438.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">activity reports</text><rect x="960" y="500" width="210" height="70" rx="6" fill="#fbf0e1" stroke="#9a5a12" stroke-width="1.4"/><text x="1065" y="531.5" font-family="Arial" font-size="14" font-weight="700" fill="#9a5a12" text-anchor="middle">VesselFinder</text><text x="1065" y="548.5" font-family="Arial" font-size="12" font-weight="400" fill="#5b6b7c" text-anchor="middle">map embed (browser)</text><defs><marker id="m56" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><line x1="210" y1="230" x2="298" y2="230" stroke="#7a8a9a" stroke-width="1.6" marker-end="url(#m56)"/><text x="254" y="222" font-family="Arial" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">HTTPS 443</text><defs><marker id="m59" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><line x1="430" y1="330" x2="430" y2="398" stroke="#7a8a9a" stroke-width="1.6" marker-end="url(#m59)"/><text x="348" y="368" font-family="Arial" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">HTTP/WS 3001 (private)</text><defs><marker id="m62" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><line x1="560" y1="515" x2="638" y2="515" stroke="#7a8a9a" stroke-width="1.6" marker-end="url(#m62)"/><text x="599" y="507" font-family="Arial" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">TLS 5432</text><defs><marker id="p65" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><polyline points="470,400 470,348 915,348 915,185 958,185" fill="none" stroke="#7a8a9a" stroke-width="1.6" marker-end="url(#p65)"/><defs><marker id="p67" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><polyline points="500,400 500,363 930,363 930,305 958,305" fill="none" stroke="#7a8a9a" stroke-width="1.6" marker-end="url(#p67)"/><defs><marker id="p69" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><polyline points="530,400 530,378 945,378 945,425 958,425" fill="none" stroke="#7a8a9a" stroke-width="1.6" marker-end="url(#p69)"/><text x="760" y="342" font-family="Arial" font-size="10" font-weight="400" fill="#5b6b7c" text-anchor="middle">outbound HTTPS 443: Hub token/JWKS · Sheets API · SMTP</text><defs><marker id="p72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><polyline points="125,185 125,60 1065,60 1065,108" fill="none" stroke="#7a8a9a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#p72)"/><text x="620" y="54" font-family="Arial" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">authorize redirect · SDK beacons (browser → Hub)</text><defs><marker id="p75" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8a9a"/></marker></defs><polyline points="125,275 125,685 1065,685 1065,572" fill="none" stroke="#7a8a9a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#p75)"/><text x="620" y="680" font-family="Arial" font-size="11" font-weight="400" fill="#5b6b7c" text-anchor="middle">map iframe (browser)</text></svg>