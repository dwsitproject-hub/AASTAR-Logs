<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AASTAR Logistic (Export)">
  <!-- Concept B "Outbound tanker": a product tanker heading right, with an export arrow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b8398"/>
      <stop offset="1" stop-color="#22465a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- export arrow -->
  <path d="M 268 196 L 396 104" fill="none" stroke="#f08b6c" stroke-width="34" stroke-linecap="round"/>
  <polyline points="326,96 404,98 400,176" fill="none" stroke="#f08b6c" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- superstructure and funnel at the stern -->
  <rect x="112" y="226" width="86" height="74" rx="10" fill="#ffffff"/>
  <rect x="134" y="192" width="30" height="44" rx="6" fill="#e2664b"/>
  <!-- hull, raked bow to the right -->
  <path d="M 84 296 L 440 296 L 392 372 L 116 372 Z" fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
  <!-- cargo tank domes -->
  <circle cx="258" cy="286" r="14" fill="#ffffff"/>
  <circle cx="314" cy="286" r="14" fill="#ffffff"/>
  <circle cx="370" cy="286" r="14" fill="#ffffff"/>
  <!-- sea -->
  <path d="M 92 420 C 132 404, 172 436, 212 420 S 292 404, 332 420 S 400 436, 424 424" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="18" stroke-linecap="round"/>
</svg>
