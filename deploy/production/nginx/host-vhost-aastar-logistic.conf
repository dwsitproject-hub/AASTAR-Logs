# Host nginx vhost for http://aastar-logistic.kpndomain.com on the FE server 172.28.80.50.
# Install when the DNS record exists (guide §8):
#   cp /opt/astar-erp/src/deploy/production/nginx/host-vhost-aastar-logistic.conf /etc/nginx/conf.d/aastar-logistic.conf
#   nginx -t && systemctl reload nginx        (nginx -t is NOT optional: this nginx is shared)
# Never default_server: unknown host names must keep reaching whatever answered before.

server {
    listen 80;
    listen [::]:80;
    server_name aastar-logistic.kpndomain.com;
    server_tokens off;

    # The app accepts small JSON bodies only (the container caps /api at 200k).
    client_max_body_size 1m;

    location / {
        # The app's frontend container, on this server's private address (fe.compose.yml).
        proxy_pass http://172.28.80.50:3150;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;   # required, or the session cookie / origin check break
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # the container trusts only this hop for it
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        # Realtime updates (/api/ws)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade_astar;
    }

    location = /api/ws {
        proxy_pass http://172.28.80.50:3150;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 1h;
    }
}

# "upgrade" for WebSocket requests, otherwise an empty Connection header (keep-alive).
# Named for this app so it cannot clash with another vhost's map.
map $http_upgrade $connection_upgrade_astar {
    default upgrade;
    ''      '';
}

# With TLS (guide §11): a `listen 443 ssl;` server carrying the certificate and these
# locations, and the port-80 server reduced to `return 301 https://$host$request_uri;`.
